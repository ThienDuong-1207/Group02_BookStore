name: Supabase keep-alive

# Free Supabase projects pause after 7 days without activity.
# This job reads one row from each project every 3 days so the site stays online until 17/11/2026.
# Add repository secrets: STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, PROD_SUPABASE_URL, PROD_SUPABASE_ANON_KEY

on:
  schedule:
    - cron: "17 2 */3 * *"   # every 3 days, 09:17 Vietnam time
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping staging
        run: |
          curl -sf "${{ secrets.STAGING_SUPABASE_URL }}/rest/v1/books_public?select=id&limit=1" \
            -H "apikey: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}" > /dev/null
      - name: Ping production
        run: |
          curl -sf "${{ secrets.PROD_SUPABASE_URL }}/rest/v1/books_public?select=id&limit=1" \
            -H "apikey: ${{ secrets.PROD_SUPABASE_ANON_KEY }}" > /dev/null
